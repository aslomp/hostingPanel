name: Apache baseline smoke test
on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'src/HostingPanel.Backends.Kubernetes/**'
      - '.github/workflows/apache-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render chart
        run: |
          helm template smoke deploy/helm/hostingpanel --namespace hosting --set backend=Kubernetes --set kubernetesHosting.enabled=true --set kubernetesHosting.nfsServer=192.0.2.1 --set kubernetesHosting.nfsPath=/home --set kubernetesHosting.gatewayName=smoke --set kubernetesHosting.apacheConfigPath=/exports/apache-config --set powerDns.enabled=false --set certManager.enabled=false > /tmp/hosting-rendered.yaml
          python3 - <<'PY'
          import pathlib, yaml
          docs = list(yaml.safe_load_all(pathlib.Path('/tmp/hosting-rendered.yaml').read_text()))
          config = next(d for d in docs if d and d.get('kind') == 'ConfigMap' and d['metadata']['name'] == 'apache-baseline')
          deployment = next(d for d in docs if d and d.get('kind') == 'StatefulSet' and d['metadata']['name'] == 'apache-baseline')
          pod = deployment['spec']['template']['spec']
          apache = next(c for c in pod['containers'] if c['name'] == 'apache')
          assert pod['automountServiceAccountToken'] is False
          assert pod['securityContext']['runAsNonRoot'] is True
          assert apache['securityContext']['allowPrivilegeEscalation'] is False
          assert 'ALL' in apache['securityContext']['capabilities']['drop']
          assert next(m for m in apache['volumeMounts'] if m['mountPath'] == '/home')['readOnly'] is True
          pathlib.Path('/tmp/hosting-httpd.conf').write_text(config['data']['httpd.conf'])
          pathlib.Path('/tmp/hosting-apache-image').write_text(apache['image'])
          PY
      - name: Verify dedicated shared storage and scoped reload authorization
        run: |
          python3 - <<'PY'
          import pathlib, yaml
          docs = [d for d in yaml.safe_load_all(pathlib.Path('/tmp/hosting-rendered.yaml').read_text()) if d]
          seen = set()
          for d in docs:
              if d.get('kind') not in ('Deployment', 'StatefulSet'):
                  continue
              pod = d['spec']['template']['spec']
              for container in pod['containers']:
                  mounts = [m for m in container.get('volumeMounts', []) if m['name'] == 'apache-config']
                  if container['name'] not in ('web', 'apache'):
                      assert not mounts
                      continue
                  assert len(mounts) == 1
                  assert mounts[0]['mountPath'] == '/storage/apache-config'
                  assert mounts[0].get('readOnly', False) == (container['name'] == 'apache')
                  volume = next(v for v in pod['volumes'] if v['name'] == 'apache-config')
                  assert volume['nfs'] == {'server': '192.0.2.1', 'path': '/exports/apache-config', 'readOnly': container['name'] == 'apache'}
                  assert 'persistentVolumeClaim' not in volume
                  seen.add(container['name'])
              assert all(c['name'] != 'vhost-sync' for c in pod['containers'])
          assert seen == {'web', 'apache'}
          rules = [r for d in docs if d.get('kind') == 'Role' for r in d['rules'] if 'pods/exec' in r.get('resources', [])]
          assert len(rules) == 1 and rules[0]['resourceNames'] == ['apache-baseline-0']
          PY
      - name: Validate Apache configuration and MPM
        run: |
          set -eu
          image="$(cat /tmp/hosting-apache-image)"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' || docker image inspect "$image"
          docker run --rm --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro "$image" httpd -t -f /etc/hostingpanel/httpd.conf
          docker run --rm --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro "$image" httpd -M -f /etc/hostingpanel/httpd.conf | tee /tmp/apache-modules
          grep -q mpm_event_module /tmp/apache-modules
          grep -q logio_module /tmp/apache-modules
      - name: Smoke test baseline listeners
        run: |
          set -eu
          image="$(cat /tmp/hosting-apache-image)"
          trap 'docker rm -f hosting-apache-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name hosting-apache-smoke --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro "$image" httpd -DFOREGROUND -f /etc/hostingpanel/httpd.conf
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/ >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: unknown.invalid' http://127.0.0.1:18080/)" = 403
      - name: Smoke test static virtualhost
        run: |
          set -eu
          image="$(cat /tmp/hosting-apache-image)"
          trap 'docker rm -f hosting-apache-vhost >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/hosting-static/public_html /tmp/hosting-vhosts/revision
          printf '%s\n' 'IncludeOptional /storage/apache-config/revision/*.conf' > /tmp/hosting-vhosts/active.conf
          printf '%s\n' 'hostingpanel-static-smoke' > /tmp/hosting-static/public_html/index.html
          chmod -R a+rX /tmp/hosting-static /tmp/hosting-vhosts
          cat > /tmp/hosting-vhosts/revision/site.conf <<'CONF'
          <VirtualHost *:8080>
            ServerName smoke.invalid
            CustomLog /proc/self/fd/1 "HP_ACCESS_V1 00000000000000000000000000000001 00000000000000000000000000000002 %{end:sec}t %>s %I %O %D"
            DocumentRoot "/home/smoke/public_html"
            <Directory "/home/smoke/public_html">
              Options -Indexes -ExecCGI -Includes -FollowSymLinks -SymLinksIfOwnerMatch
              AllowOverride None
              Require all granted
              DirectoryIndex index.html
            </Directory>
          </VirtualHost>
          CONF
          docker run --rm --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro -v /tmp/hosting-vhosts:/storage/apache-config:ro "$image" httpd -t -f /etc/hostingpanel/httpd.conf
          docker run -d --name hosting-apache-vhost --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro -v /tmp/hosting-vhosts:/storage/apache-config:ro -v /tmp/hosting-static:/home/smoke:ro "$image" httpd -DFOREGROUND -f /etc/hostingpanel/httpd.conf
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS -H 'Host: smoke.invalid' 'http://127.0.0.1:18080/?secret=never-log-this')" = hostingpanel-static-smoke
          docker logs hosting-apache-vhost > /tmp/hosting-access.log 2>&1
          grep -E '^HP_ACCESS_V1 00000000000000000000000000000001 00000000000000000000000000000002 [0-9]+ 200 [1-9][0-9]* [1-9][0-9]* [0-9]+ -o /dev/null -w '%{http_code}' -H 'Host: unknown.invalid' http://127.0.0.1:18080/)" = 403
      - name: Verify invalid candidate isolation and graceful revision changes
        run: |
          set -eu
          image="$(cat /tmp/hosting-apache-image)"
          trap 'docker rm -f hosting-apache-reload >/dev/null 2>&1 || true' EXIT
          root=/tmp/hosting-vhosts
          mkdir -p "$root/empty" "$root/invalid"
          printf '%s\n' 'NotAnApacheDirective' > "$root/invalid/site.conf"
          printf '%s\n' 'IncludeOptional /storage/apache-config/revision/*.conf' > "$root/active.conf"
          docker run -d --name hosting-apache-reload --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro -v "$root:/storage/apache-config:ro" -v /tmp/hosting-static:/home/smoke:ro "$image" httpd -DFOREGROUND -f /etc/hostingpanel/httpd.conf
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = hostingpanel-static-smoke
          if docker exec hosting-apache-reload httpd -t -f /etc/hostingpanel/httpd.conf -D HOSTINGPANEL_CANDIDATE -c 'IncludeOptional /storage/apache-config/invalid/*.conf'; then
            echo "Invalid candidate was accepted"; exit 1
          fi
          test "$(curl -fsS -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = hostingpanel-static-smoke
          docker exec hosting-apache-reload httpd -t -f /etc/hostingpanel/httpd.conf -D HOSTINGPANEL_CANDIDATE -c 'IncludeOptional /storage/apache-config/empty/*.conf'
          select_revision() {
            printf 'IncludeOptional /storage/apache-config/%s/*.conf\n' "$1" > "$root/next.conf"
            mv "$root/next.conf" "$root/active.conf"
            docker exec hosting-apache-reload httpd -t -f /etc/hostingpanel/httpd.conf
            docker exec hosting-apache-reload httpd -k graceful -f /etc/hostingpanel/httpd.conf
          }
          await_status() {
            for attempt in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = "$1" ]; then return 0; fi
              sleep 1
            done
            return 1
          }
          select_revision empty
          await_status 403
          select_revision revision
          await_status 200
          test "$(curl -fsS -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = hostingpanel-static-smoke
      - name: Show Apache logs
        if: failure()
        run: docker logs hosting-apache-smoke || true
 /tmp/hosting-access.log
          ! grep -q never-log-this /tmp/hosting-access.log
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: unknown.invalid' http://127.0.0.1:18080/)" = 403
      - name: Verify invalid candidate isolation and graceful revision changes
        run: |
          set -eu
          image="$(cat /tmp/hosting-apache-image)"
          trap 'docker rm -f hosting-apache-reload >/dev/null 2>&1 || true' EXIT
          root=/tmp/hosting-vhosts
          mkdir -p "$root/empty" "$root/invalid"
          printf '%s\n' 'NotAnApacheDirective' > "$root/invalid/site.conf"
          printf '%s\n' 'IncludeOptional /storage/apache-config/revision/*.conf' > "$root/active.conf"
          docker run -d --name hosting-apache-reload --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 -v /tmp/hosting-httpd.conf:/etc/hostingpanel/httpd.conf:ro -v "$root:/storage/apache-config:ro" -v /tmp/hosting-static:/home/smoke:ro "$image" httpd -DFOREGROUND -f /etc/hostingpanel/httpd.conf
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = hostingpanel-static-smoke
          if docker exec hosting-apache-reload httpd -t -f /etc/hostingpanel/httpd.conf -D HOSTINGPANEL_CANDIDATE -c 'IncludeOptional /storage/apache-config/invalid/*.conf'; then
            echo "Invalid candidate was accepted"; exit 1
          fi
          test "$(curl -fsS -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = hostingpanel-static-smoke
          docker exec hosting-apache-reload httpd -t -f /etc/hostingpanel/httpd.conf -D HOSTINGPANEL_CANDIDATE -c 'IncludeOptional /storage/apache-config/empty/*.conf'
          select_revision() {
            printf 'IncludeOptional /storage/apache-config/%s/*.conf\n' "$1" > "$root/next.conf"
            mv "$root/next.conf" "$root/active.conf"
            docker exec hosting-apache-reload httpd -t -f /etc/hostingpanel/httpd.conf
            docker exec hosting-apache-reload httpd -k graceful -f /etc/hostingpanel/httpd.conf
          }
          await_status() {
            for attempt in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = "$1" ]; then return 0; fi
              sleep 1
            done
            return 1
          }
          select_revision empty
          await_status 403
          select_revision revision
          await_status 200
          test "$(curl -fsS -H 'Host: smoke.invalid' http://127.0.0.1:18080/)" = hostingpanel-static-smoke
      - name: Show Apache logs
        if: failure()
        run: docker logs hosting-apache-smoke || true
