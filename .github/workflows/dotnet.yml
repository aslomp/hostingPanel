name: .NET build and contract tests
on:
  pull_request:
  push:
    branches:
      - main
      - feature/blazor-directadmin-api
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build src/HostingPanel.Api/HostingPanel.Api.csproj -c Release
      - name: Build Blazor web
        run: dotnet build src/HostingPanel.Web/HostingPanel.Web.csproj -c Release
      - name: Run contract tests
        run: dotnet run --project tests/HostingPanel.ContractTests -c Release
      - name: Smoke test Blazor framework script
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5088 dotnet run --no-build -c Release --project src/HostingPanel.Web > /tmp/hosting-panel-web.log 2>&1 &
          webpid=$!
          trap 'cat /tmp/hosting-panel-web.log; kill "$webpid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5088/ -o /tmp/hostingpanel.html; then break; fi
            sleep 1
          done
          grep -q '/_framework/blazor.web.js' /tmp/hostingpanel.html
          curl --fail --silent --show-error -D /tmp/asset-headers.txt -o /tmp/blazor.web.js http://127.0.0.1:5088/_framework/blazor.web.js
          test -s /tmp/blazor.web.js
          curl --fail --silent --show-error -D /tmp/css-headers.txt -o /tmp/site.css http://127.0.0.1:5088/site.css
          test -s /tmp/site.css
          grep -q '.sidebar' /tmp/site.css
          grep -qi 'content-type:.*css' /tmp/css-headers.txt
          grep -qi 'content-type:.*javascript' /tmp/asset-headers.txt

      - name: Smoke test Production mode asset endpoints
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5089 dotnet run --no-build -c Release --project src/HostingPanel.Web >/tmp/hp-prod.log 2>&1 &
          pid=$!
          trap 'cat /tmp/hp-prod.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -sS http://127.0.0.1:5089/ -o /tmp/hp-home; then break; fi
            sleep 1
          done
          for path in site.css _framework/blazor.web.js; do
            echo "Request: $path"
            curl -sS -D /tmp/hp-headers -o /tmp/hp-body "http://127.0.0.1:5089/$path"
            cat /tmp/hp-headers
            wc -c /tmp/hp-body
            head -c 200 /tmp/hp-body || true
            echo
          done
          curl -fsS http://127.0.0.1:5089/site.css -o /tmp/hp-style
          grep -q '.sidebar' /tmp/hp-style
          curl -fsS http://127.0.0.1:5089/_framework/blazor.web.js -o /tmp/hp-script
          test "$(wc -c </tmp/hp-script)" -gt 1000

      - name: Validate pinned Swagger and static API endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("src/HostingPanel.Api/spec/directadmin.swagger.json") as f:
              spec=json.load(f)
          assert spec["swagger"] == "2.0"
          assert len(spec["paths"]) > 200
          print("Swagger static endpoints:", len(spec["paths"]))
          PY
          ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5090 \
            DirectAdmin__BaseUrl=https://demo.directadmin.com:2222/ \
            dotnet run --no-build -c Release --project src/HostingPanel.Api >/tmp/hp-api.log 2>&1 &
          pid=$!
          trap 'cat /tmp/hp-api.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5090/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5090/openapi/directadmin.json -o /tmp/hosted-swagger.json
          cmp src/HostingPanel.Api/spec/directadmin.swagger.json /tmp/hosted-swagger.json
          for endpoint in /api/users/demo/config /api/users/demo/usage /hosting/domains /hosting/domains/demo.xyz1 /hosting/users/demo/overview /hosting/domains/demo.xyz1/dns; do
            status=$(curl -s -o /tmp/response -w '%{http_code}' "http://127.0.0.1:5090$endpoint")
            test "$status" = "401"
            grep -q 'UNAUTHORIZED' /tmp/response
          done

      - name: Validate read-only preview and global mutation gate
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5091 \
            DirectAdmin__BaseUrl=https://demo.directadmin.com:2222/ \
            dotnet run --no-build -c Release --project src/HostingPanel.Api >/tmp/hp-domains.log 2>&1 &
          pid=$!
          trap 'cat /tmp/hp-domains.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5091/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          status=$(curl -sS -o /tmp/hp-domain-preview -w '%{http_code}' -X POST \
            -H 'Authorization: Basic ZGVtbzpkZW1v' \
            -H 'Content-Type: application/json' \
            -d '{"domain":"hosting-test.xyz1","php":true,"ssl":true,"cgi":false}' \
            http://127.0.0.1:5091/hosting/domains/preview)
          test "$status" = "200"
          python3 - <<'PY'
          import json
          doc=json.load(open("/tmp/hp-domain-preview"))
          assert doc["domain"] == "hosting-test.xyz1"
          assert doc["dryRun"] is True and doc["executed"] is False
          assert doc["legacyEndpoint"] == "CMD_API_DOMAIN"
          PY
          status=$(curl -sS -o /tmp/hp-invalid-domain -w '%{http_code}' -X POST \
            -H 'Authorization: Basic ZGVtbzpkZW1v' \
            -H 'Content-Type: application/json' \
            -d '{"domain":"production.com"}' \
            http://127.0.0.1:5091/hosting/domains/preview)
          test "$status" = "200"

          # Mutations must be disabled by default, even with apparently valid Basic credentials.
          code=$(curl -sS -o /tmp/hp-disabled -w '%{http_code}' -X POST \
            -H 'Authorization: Basic ZGVtbzpkZW1v' \
            -H 'Content-Type: application/json' \
            -d '{"domain":"hosting-test.xyz1","action":"create","confirmation":"hosting-test.xyz1"}' \
            http://127.0.0.1:5091/hosting/domains/execute)
          test "$code" = "409"
          grep -q MUTATIONS_DISABLED /tmp/hp-disabled
          code=$(curl -sS -o /tmp/hp-invalid -w '%{http_code}' -X POST \
            -H 'Authorization: Basic ZGVtbzpkZW1v' \
            -H 'Content-Type: application/json' \
            -d '{"domain":"example.com","action":"delete","confirmation":"example.com"}' \
            http://127.0.0.1:5091/hosting/domains/execute)
          test "$code" = "409"

      - name: Check domain settings mutation is blocked globally
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5092 \
            DirectAdmin__BaseUrl=https://demo.directadmin.com:2222/ \
            dotnet run --no-build -c Release --project src/HostingPanel.Api >/tmp/hp-domain-detail.log 2>&1 &
          pid=$!
          trap 'cat /tmp/hp-domain-detail.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5092/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          code=$(curl -sS -o /tmp/hp-settings-disabled -w '%{http_code}' -X PUT \
            -H 'Authorization: Basic ZGVtbzpkZW1v' -H 'Content-Type: application/json' \
            -d '{"setting":"ssl","value":"ON"}' \
            http://127.0.0.1:5092/hosting/domains/demo.xyz1/settings)
          test "$code" = "409"
          grep -q MUTATIONS_DISABLED /tmp/hp-settings-disabled

      - name: DNS mutation respects global read-only mode
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5093 \
            DirectAdmin__BaseUrl=https://demo.directadmin.com:2222/ \
            dotnet run --no-build -c Release --project src/HostingPanel.Api >/tmp/hp-dns.log 2>&1 &
          pid=$!
          trap 'cat /tmp/hp-dns.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5093/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          code=$(curl -sS -o /tmp/hp-dns-disabled -w '%{http_code}' -X POST \
            -H 'Authorization: Basic ZGVtbzpkZW1v' -H 'Content-Type: application/json' \
            -d '{"action":"add","record":{"type":"A","name":"www","value":"192.0.2.10"}}' \
            http://127.0.0.1:5093/hosting/domains/hosting-test.xyz1/dns)
          test "$code" = "409"
          grep -q MUTATIONS_DISABLED /tmp/hp-dns-disabled
