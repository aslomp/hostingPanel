name: Installer checks
on:
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/installer-check.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check host package availability
        run: |
          sudo apt-get update
          # Hosted runners may ship Docker CE rather than Ubuntu's Docker packages.
          # Remove conflicting packages only in the simulated APT transaction.
          remove=()
          for package in docker-ce docker-ce-cli containerd.io docker-ce-rootless-extras; do
            if dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null | grep -qx installed; then
              remove+=("$package-")
            fi
          done
          sudo apt-get -s install "${remove[@]}" python3 iproute2 zfsutils-linux nfs-kernel-server targetcli-fb openssh-server sudo openssl nftables clamav clamav-freshclam clamav-daemon clamdscan curl ca-certificates nfs-common open-iscsi docker.io dnsutils
      - run: |
          for script in installer/*.sh; do bash -n "$script"; done
          for script in installer/lib/*.sh; do bash -n "$script"; done
          bash installer/install.sh --help
          source installer/lib/apparmor-compat.sh
          needs_apparmor_compat ubuntu 26.04 7.0.0-44-generic v1.35.10+k3s1
          ! needs_apparmor_compat ubuntu 24.04 7.0.0-44-generic v1.35.10+k3s1
          ! needs_apparmor_compat ubuntu 26.04 7.0.0-45-generic v1.35.10+k3s1
          ! needs_apparmor_compat ubuntu 26.04 7.0.0-44-generic v1.35.11+k3s1
          sudo apt-get install -y apparmor
          sudo apparmor_parser -Q -K installer/compat/containerd-2.2.10-k3s1.apparmor
          # Exercise the actual wipefs CLI on a disposable regular file, without writing signatures.
          image=$(mktemp)
          truncate -s 16M "$image"
          test -z "$(wipefs --no-act --noheadings --output TYPE "$image")"
          rm -f "$image"
          python3 -m py_compile installer/generate.py installer/zfs-retention.py installer/bootstrap-dns.py
          python3 -m unittest discover -s installer -p 'test_*.py'
          tmp=$(mktemp -d)
          python3 -c 'import json,sys; c=json.load(open("installer/cluster.example.json")); c["acmeEmail"]="test@invalid.test"; json.dump(c,open(sys.argv[1],"w"))' "$tmp/cluster.json"
          printf test-key > "$tmp/csi-key"
          printf 0123456789abcdef > "$tmp/iscsi-chap"
          python3 installer/generate.py "$tmp/cluster.json" generate
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          for name in ("csi-nfs","csi-iscsi","gateways","issuer","panel-bootstrap-tls","hosting-values"):
              f=p/(name+".json")
              assert f.stat().st_mode & 0o777 == 0o600
              json.loads(f.read_text())
          tls = json.loads((p/"panel-bootstrap-tls.json").read_text())["items"]
          assert tls[0]["spec"] == {"selfSigned": {}}
          assert tls[1]["spec"]["issuerRef"]["name"] == "hosting-panel-selfsigned"
          assert tls[1]["spec"]["secretName"] == "hosting-panel-tls"
          gateway = next(x for x in json.loads((p/"gateways.json").read_text())["items"] if x["kind"] == "Gateway" and x["metadata"]["name"] == "external")
          assert "cert-manager.io/cluster-issuer" not in gateway["metadata"].get("annotations", {})
          assert gateway["spec"]["listeners"][1]["tls"]["certificateRefs"][0]["name"] == tls[1]["spec"]["secretName"]
          for protocol in ("nfs", "iscsi"):
              assert json.loads((p/("csi-"+protocol+".json")).read_text())["controller"] == {"hostNetwork": True, "dnsPolicy": "ClusterFirstWithHostNet"}
          values = json.loads((p/"hosting-values.json").read_text())
          cfg = json.loads((p/"cluster.json").read_text())
          assert values["powerDns"]["serviceType"] == "ClusterIP"
          assert values["powerDns"]["externalIPs"] == [cfg["clusterHost"]]
          assert values["sqlite"]["storageClassName"] == "zfs-iscsi"
          assert json.loads((p/"csi-iscsi.json").read_text())["driver"]["config"]["iscsi"]["shareStrategyTargetCli"]["tpg"]["attributes"]["authentication"] == 1
          PY
