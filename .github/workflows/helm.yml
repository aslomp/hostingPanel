name: Helm deployment validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Lint default chart
        run: helm lint deploy/helm/hostingpanel
      - name: Lint and render hosting profile
        shell: bash
        run: |
          set -euo pipefail
          args=(-n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway)
          helm lint deploy/helm/hostingpanel "${args[@]}"
          helm template admin deploy/helm/hostingpanel "${args[@]}" > /tmp/hosting.yaml
          grep -q 'harbor.eagleconnect.nl/hosting/admin:latest' /tmp/hosting.yaml
          grep -q 'php:8.6.0-fpm' /tmp/hosting.yaml
          grep -q 'name: apache-baseline' /tmp/hosting.yaml
          grep -q 'kind: RoleBinding' /tmp/hosting.yaml
          helm template admin deploy/helm/hostingpanel "${args[@]}" --set powerDns.enabled=true --show-only templates/powerdns.yaml > /tmp/powerdns.yaml
          grep -q 'fsGroup: 953' /tmp/powerdns.yaml
          grep -q 'fsGroupChangePolicy: OnRootMismatch' /tmp/powerdns.yaml
          for invalid in "" / /exports/sites /exports/sites/config /exports /exports/apache-config/../sites; do
            if helm template admin deploy/helm/hostingpanel "${args[@]}" --set-string "kubernetesHosting.apacheConfigPath=$invalid" > /tmp/invalid.yaml 2>/tmp/invalid.err; then
              echo "Unexpectedly accepted Apache export: $invalid"; exit 1
            fi
            grep -qE 'apacheConfigPath|Apache configuration NFS export' /tmp/invalid.err
          done
      - name: Render optional SFTPGo infrastructure
        run: |
          helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway --set sftpgo.enabled=true --set sftpgo.existingSecret=sftpgo-bootstrap --show-only templates/sftpgo.yaml > /tmp/sftpgo.yaml
          grep -q 'kind: StatefulSet' /tmp/sftpgo.yaml
          grep -q 'kind: NetworkPolicy' /tmp/sftpgo.yaml
          grep -q 'SFTPGO_SFTPD__PASSWORD_AUTHENTICATION' /tmp/sftpgo.yaml
          grep -q 'readOnly: false' /tmp/sftpgo.yaml
          grep -q 'runAsUser: 0' /tmp/sftpgo.yaml
          helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway --set sftpgo.enabled=true --set sftpgo.existingSecret=sftpgo-bootstrap --set sftpgo.enableWrites=false --show-only templates/sftpgo.yaml > /tmp/sftpgo-staging.yaml
          grep -q 'readOnly: true' /tmp/sftpgo-staging.yaml
          grep -q 'runAsNonRoot: true' /tmp/sftpgo-staging.yaml

      - name: Render durable Apache accounting profile
        run: |
          set -eu
          args=''
          helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.apacheConfigPath=/exports/apache --set kubernetesHosting.gatewayName=example-gateway --set kubernetesHosting.accountingSpool.enabled=true --set kubernetesHosting.accountingSpool.path=/exports/accounting --set kubernetesHosting.accountingSpool.image=example.invalid/apache:ci --set kubernetesHosting.accountingSpool.endpoint=https://panel.example.invalid --set kubernetesHosting.accountingSpool.existingSecret=accounting > /tmp/accounting.yaml
          grep -q 'name: accounting-spool' /tmp/accounting.yaml
          grep -q 'name: KubernetesHosting__DurableLogIngestion' /tmp/accounting.yaml
          grep -q 'path: "/exports/accounting"' /tmp/accounting.yaml
          if helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.apacheConfigPath=/exports/apache --set kubernetesHosting.gatewayName=example-gateway --set kubernetesHosting.accountingSpool.enabled=true --set kubernetesHosting.accountingSpool.path=/exports/sites/accounting --set kubernetesHosting.accountingSpool.image=example.invalid/apache:ci --set kubernetesHosting.accountingSpool.endpoint=https://panel.example.invalid --set kubernetesHosting.accountingSpool.existingSecret=accounting >/tmp/bad-accounting.yaml 2>/tmp/bad-accounting.err; then
            echo 'Unexpectedly accepted overlapping accounting export'; exit 1
          fi
          grep -q 'Accounting export must not overlap' /tmp/bad-accounting.err
