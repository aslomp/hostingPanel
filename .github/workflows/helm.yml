name: Helm deployment validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Lint default chart
        run: helm lint deploy/helm/hostingpanel
      - name: Lint and render hosting profile
        shell: bash
        run: |
          set -euo pipefail
          args=(-n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway --set sftp.jailExport=/exports/sftp-jails --set sftp.image=example.invalid/openssh:ci --set sftp.existingSecret=ssh-hostkeys)
          helm lint deploy/helm/hostingpanel "${args[@]}"
          helm template admin deploy/helm/hostingpanel "${args[@]}" > /tmp/hosting.yaml
          grep -q 'harbor.eagleconnect.nl/hosting/admin:latest' /tmp/hosting.yaml
          grep -q 'php:8.6.0-fpm' /tmp/hosting.yaml
          grep -q 'name: apache-baseline' /tmp/hosting.yaml
          grep -q 'kind: RoleBinding' /tmp/hosting.yaml
          helm template admin deploy/helm/hostingpanel "${args[@]}" --set powerDns.enabled=true --show-only templates/powerdns.yaml > /tmp/powerdns.yaml
          grep -q 'fsGroup: 953' /tmp/powerdns.yaml
          grep -q 'fsGroupChangePolicy: OnRootMismatch' /tmp/powerdns.yaml
          for invalid in "" / /exports/sites /exports/sites/config /exports /exports/apache-config/../sites; do
            if helm template admin deploy/helm/hostingpanel "${args[@]}" --set-string "kubernetesHosting.apacheConfigPath=$invalid" > /tmp/invalid.yaml 2>/tmp/invalid.err; then
              echo "Unexpectedly accepted Apache export: $invalid"; exit 1
            fi
            grep -qE 'apacheConfigPath|Apache configuration NFS export' /tmp/invalid.err
          done
      - name: Render OpenSSH upgrade with installer defaults
        run: |
          set -eu
          args=(-n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway)
          for mode in omitted empty; do
            extra=()
            if [ "$mode" = empty ]; then
              extra=(--set-string sftp.jailExport= --set-string sftp.image= --set-string sftp.existingSecret=)
            fi
            helm template admin deploy/helm/hostingpanel "${args[@]}" "${extra[@]}" > "/tmp/sftp-$mode.yaml"
            python3 - "/tmp/sftp-$mode.yaml" <<'PY'
          import sys, yaml
          docs = [x for x in yaml.safe_load_all(open(sys.argv[1])) if x]
          web = next(x for x in docs if x["kind"] == "Deployment" and x["metadata"]["name"].endswith("-web"))
          ssh = next(x for x in docs if x["kind"] == "StatefulSet" and x["metadata"]["name"] == "admin-sftp")
          webvol = next(v for v in web["spec"]["template"]["spec"]["volumes"] if v["name"] == "sftp-jails")
          sshspec = ssh["spec"]["template"]["spec"]
          jail = next(v for v in sshspec["volumes"] if v["name"] == "jails")
          hostkeys = next(v for v in sshspec["volumes"] if v["name"] == "hostkeys")
          assert webvol["nfs"]["path"] == jail["nfs"]["path"] == "/srv/hosting/sftp-jails"
          assert webvol["nfs"]["readOnly"] is True
          assert jail["nfs"]["readOnly"] is False
          assert hostkeys["secret"]["secretName"] == "hostingpanel-ssh-hostkeys"
          assert sshspec["containers"][0]["image"] == "hostingpanel-openssh:installer-local"
          PY
          done
      - name: Render shared OpenSSH infrastructure
        run: |
          set -eu
          helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway --set sftp.jailExport=/exports/sftp-jails --set sftp.image=example.invalid/openssh:ci --set sftp.existingSecret=ssh-hostkeys --show-only templates/openssh.yaml > /tmp/openssh.yaml
          grep -q 'kind: StatefulSet' /tmp/openssh.yaml
          grep -q 'type: LoadBalancer' /tmp/openssh.yaml
          grep -q 'externalTrafficPolicy: Local' /tmp/openssh.yaml
          grep -q 'port: 2223, targetPort: sftp' /tmp/openssh.yaml
          helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.gatewayName=example-gateway --set sftp.jailExport=/exports/sftp-jails --set sftp.image=example.invalid/openssh:ci --set sftp.existingSecret=ssh-hostkeys --set sftp.service.port=2300 --show-only templates/openssh.yaml > /tmp/openssh-custom.yaml
          grep -q 'port: 2300, targetPort: sftp' /tmp/openssh-custom.yaml
          grep -q 'kind: NetworkPolicy' /tmp/openssh.yaml
          grep -q 'SYS_CHROOT' /tmp/openssh.yaml
          ! grep -q 'SYS_ADMIN\|DAC_OVERRIDE\|CHOWN\|sftpgo' /tmp/openssh.yaml
          if grep -q 'subPath:' /tmp/openssh.yaml; then echo 'Unexpected per-account mounts'; exit 1; fi
          grep -q 'readOnly: false' /tmp/openssh.yaml
          if helm template admin deploy/helm/hostingpanel -n hosting --set sftpgo.enabled=true >/tmp/legacy.yaml 2>/tmp/legacy.err; then
            echo "Legacy SFTPGo configuration accepted"; exit 1
          fi
          grep -q 'SFTPGo has been retired' /tmp/legacy.err

      - name: Render durable Apache accounting profile
        run: |
          set -eu
          args=''
          helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.apacheConfigPath=/exports/apache --set kubernetesHosting.gatewayName=example-gateway --set sftp.jailExport=/exports/sftp-jails --set sftp.image=example.invalid/openssh:ci --set sftp.existingSecret=ssh-hostkeys --set kubernetesHosting.accountingSpool.enabled=true --set kubernetesHosting.accountingSpool.path=/exports/accounting --set kubernetesHosting.accountingSpool.image=example.invalid/apache:ci --set kubernetesHosting.accountingSpool.endpoint=https://panel.example.invalid --set kubernetesHosting.accountingSpool.existingSecret=accounting > /tmp/accounting.yaml
          grep -q 'name: accounting-spool' /tmp/accounting.yaml
          grep -q 'name: KubernetesHosting__DurableLogIngestion' /tmp/accounting.yaml
          grep -q 'path: "/exports/accounting"' /tmp/accounting.yaml
          if helm template admin deploy/helm/hostingpanel -n hosting -f deploy/helm/values-hosting.example.yaml --set kubernetesHosting.nfsServer=192.0.2.10 --set kubernetesHosting.nfsPath=/exports/sites --set kubernetesHosting.apacheConfigPath=/exports/apache --set kubernetesHosting.gatewayName=example-gateway --set sftp.jailExport=/exports/sftp-jails --set sftp.image=example.invalid/openssh:ci --set sftp.existingSecret=ssh-hostkeys --set kubernetesHosting.accountingSpool.enabled=true --set kubernetesHosting.accountingSpool.path=/exports/sites/accounting --set kubernetesHosting.accountingSpool.image=example.invalid/apache:ci --set kubernetesHosting.accountingSpool.endpoint=https://panel.example.invalid --set kubernetesHosting.accountingSpool.existingSecret=accounting >/tmp/bad-accounting.yaml 2>/tmp/bad-accounting.err; then
            echo 'Unexpectedly accepted overlapping accounting export'; exit 1
          fi
          grep -q 'Accounting export must not overlap' /tmp/bad-accounting.err
