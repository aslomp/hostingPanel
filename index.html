<script>
"use strict";
/** All data below is illustrative. No network or server-management requests are sent. */
const sections = [
  {title:"Accountbeheer",icon:"♙",items:[["Nieuwe Gebruiker Toevoegen","♙"],["Toon Alle Gebruikers","♧"],["Mijn Gebruikers","♙"],["Beheer gebruikers pakketten","▤"],["Verplaats Gebruikers tussen Resellers","⇄"],["Berichtsjablonen","✉"],["Wachtwoorden wijzigen","⚿"],["Reseller Aanmaken","♙"],["Resellers","♙"],["Beheer Reseller Pakketten","▤"],["Admin Aanmaken","♙"],["Administrators","♙"]]},
  {title:"Server Beheer",icon:"▣",items:[["Administrator instellingen","⚙"],["Aangepaste HTTPD configuraties","▤"],["DNS Beheer","◎"],["IP Beheer","⌁"],["Naam Servers","◇"],["Multi Server Instellen","▦"],["PHP Instellingen","⌘"],["Server TLS Certificaat","♢"],["CustomBuild","⚒"]]},
  {title:"Admin Gereedschap",icon:"⚒",items:[["Back-up en herstel","◷"],["Brute Force Monitor","♢"],["Proces Monitor","▥"],["Beheer van e-mail wachtrij","✉"],["Systeem Services","⚙"],["Systeem Backup","▣"],["cPanel Importeren","⇩"],["Bericht aan Alle Gebruikers","✉"],["Thema’s","◈"],["Evolution Thema Aanpassen","◈"],["Onderhoud","⚒"]]},
  {title:"Systeem Info & Bestanden",icon:"▤",items:[["Cron Taken van alle Gebruikers","◷"],["Systeem bestand editor","▤"],["Bekijk Logboek","☷"],["Globale Statistieken","◴"]]},
  {title:"Extra Programma's",icon:"▦",items:[["Plugin Beheer","▦"],["ConfigServer Security & Firewall","♢"]]},
  {title:"Support",icon:"?",items:[["Beheer Tickets","☏"],["Ticket Aanmaken","✉"],["Updates","↻"],["Licensering","♧"]]}

const userItems=[["Domeinbeheer","◎"],["E-mailaccounts","✉"],["Bestandsbeheer","▤"],["Databases","▦"],["SSL certificaten","♢"],["DNS Beheer","◎"],["Cron Taken","◷"],["Back-ups","◷"]];
const sampleRows={
 "Toon Alle Gebruikers":[["admin","Administrator","Actief","Onbeperkt"],["demo","Gebruiker","Actief","Basis"],["hosting","Gebruiker","Actief","Business"]],
 "Mijn Gebruikers":[["demo","Gebruiker","Actief","Basis"],["hosting","Gebruiker","Actief","Business"]],
 "Resellers":[["reseller-demo","Reseller","Actief","Business"]],
 "Systeem Services":[["Webserver","HTTP","Actief","—"],["DNS","Naamresolutie","Actief","—"],["Database","Opslag","Actief","—"],["Mail","Berichten","Actief","—"]],
 "DNS Beheer":[["example.nl","Zone","Actief","5 records"],["demo.example.nl","Zone","Actief","3 records"]],
 "Domeinbeheer":[["example.nl","Website","Actief","Demo"],["demo.example.nl","Website","Actief","Demo"]],
 "E-mailaccounts":[["info@example.nl","Mailbox","Actief","1 GB"],["support@example.nl","Mailbox","Actief","2 GB"]],
 "Databases":[["demo_db","Database","Actief","PostgreSQL"]],
 "SSL certificaten":[["example.nl","TLS","Actief","Automatisch"]],
 "Bestandsbeheer":[["public_html","Directory","Actief","—"],["logs","Directory","Actief","—"]],
 "Globale Statistieken":[["Webverkeer","Statistiek","Actief","—"]]
};
let role="Admin",current="Dashboard",query="",searchText="",widgets=true;
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function visibleSections(){return role==="Admin"?sections:[{title:"Gebruiker",icon:"♙",items:userItems},{title:"Support",icon:"?",items:sections[5].items}];}
function allItems(){return visibleSections().flatMap(s=>s.items.map(([label,icon])=>({label,icon,group:s.title})));}
function go(label){current=label;query="";searchText="";render();closeSidebar();window.scrollTo({top:0,behavior:"smooth"});}
function closeSidebar(){$("sidebar").classList.remove("open");$("shade").classList.remove("show");}
const expandedNavGroups = new Set(sections.map(s=>s.title).concat(["Gebruiker"]));
function renderSidebar(){
  const scroll = document.querySelector(".side-scroll");
  const previousScroll = scroll ? scroll.scrollTop : 0;
  $("sidebarNav").innerHTML='<button class="nav-entry '+(current==="Dashboard"?"active":"")+'" data-go="Dashboard"><span class="ico">▦</span> Dashboard</button>'+visibleSections().map((s,i)=>{
    const isOpen=expandedNavGroups.has(s.title);
    const groupId="nav-section-"+i;
    return '<div class="nav-section"><button type="button" class="nav-section-toggle" data-nav-toggle="'+escapeHtml(s.title)+'" aria-expanded="'+isOpen+'" aria-controls="'+groupId+'"><span class="nav-section-symbol">'+s.icon+'</span><span>'+escapeHtml(s.title)+'</span><span class="nav-section-chevron" aria-hidden="true">⌄</span></button><div id="'+groupId+'" class="nav-section-items" '+(isOpen?'':'hidden')+'>'+s.items.map(([name,icon])=>'<button class="nav-entry '+(current===name?"active":"")+'" data-go="'+escapeHtml(name)+'"><span class="ico">'+icon+'</span><span>'+escapeHtml(name)+'</span></button>').join("")+'</div></div>';
  }).join("");
  if(scroll)scroll.scrollTop=previousScroll;
}
function cards(items){return '<div class="tiles">'+items.map(([name,icon])=>'<button class="tile" data-go="'+escapeHtml(name)+'"><span class="tile-icon">'+icon+'</span><span>'+escapeHtml(name)+'</span></button>').join("")+'</div>';}
function panel(title,icon,items){return '<section class="panel"><div class="panel-head"><div class="panel-title"><span>'+icon+'</span>'+escapeHtml(title)+'</div><div class="panel-hint">'+items.length+' onderdelen</div></div>'+cards(items)+'</section>';}
function dashboard(){
 return '<div class="heading"><div><div class="eyebrow">Hosting administratiesysteem</div><h1>Controle Paneel</h1><div class="subhead">Beheer je websites, gebruikers en server vanuit één overzicht.</div></div><div class="heading-actions"><button class="btn" id="widgetToggle">'+(widgets?"Verberg widgets":"Toon widgets")+'</button><button class="btn primary" data-action="new">＋ Nieuwe gebruiker</button></div></div>'+
 '<div class="banner"><div><h2>Welkom bij HostingPanel</h2><p>Een overzichtelijke beheeromgeving, geïnspireerd op DirectAdmin Evolution.</p></div><div class="banner-tag">◉ &nbsp; Voorbeeldgegevens</div></div>'+
 (widgets?'<div class="stat-grid"><div class="stat"><div><div class="stat-label">Gebruikers</div><div class="stat-value">24</div><div class="stat-foot">2 beheerders</div></div><div class="stat-icon">♙</div></div><div class="stat"><div><div class="stat-label">Actieve domeinen</div><div class="stat-value">38</div><div class="stat-foot">Voorbeeldomgeving</div></div><div class="stat-icon">◎</div></div><div class="stat"><div><div class="stat-label">E-mailaccounts</div><div class="stat-value">126</div><div class="stat-foot">Voorbeeldomgeving</div></div><div class="stat-icon">✉</div></div><div class="stat"><div><div class="stat-label">Websites online</div><div class="stat-value">37<span style="font-size:14px;color:#92a0b1">/38</span></div><div class="stat-foot">Gesimuleerde status</div></div><div class="stat-icon">▣</div></div></div>':'')+
 '<div class="grid-main"><div>'+visibleSections().map(s=>panel(s.title,s.icon,s.items.slice(0,s.title==="Accountbeheer"?8:8))).join("")+'</div><div class="side-panels">'+(widgets?'<div class="panel side-panel"><h3>Resourcegebruik</h3>'+usage("Schijfruimte","42 GB / 100 GB",42,"") + usage("Dataverkeer","128 GB / 500 GB",26,"green")+usage("CPU-belasting","18%",18,"orange") + usage("Geheugen","2.6 GB / 8 GB",33,"")+'</div><div class="panel side-panel"><h3>Recente activiteit</h3>'+activity("Configuratie bijgewerkt","Demo – 5 minuten geleden","blue")+activity("Back-up voltooid","Demo – 2 uur geleden","")+activity("Nieuwe gebruiker aangemaakt","Demo – gisteren","orange")+'</div>':'')+'<div class="panel side-panel"><h3>Snelle toegang</h3><button class="btn" style="width:100%;margin-bottom:9px" data-go="DNS Beheer">◎ &nbsp;DNS beheren</button><button class="btn" style="width:100%;margin-bottom:9px" data-go="Systeem Services">⚙ &nbsp;Services</button><button class="btn" style="width:100%" data-go="Back-up en herstel">◷ &nbsp;Back-ups</button></div></div></div>';
}
function usage(name,value,pct,color){return '<div class="usage"><div class="usage-title"><span>'+name+'</span><strong>'+value+'</strong></div><div class="track"><div class="fill '+color+'" style="width:'+pct+'%"></div></div></div>';}
function activity(title,time,color){return '<div class="activity"><span class="dot '+color+'"></span><div><strong>'+title+'</strong><small>'+time+'</small></div></div>';}
function listView(title){
 const rows=sampleRows[title]||[];
 const filtered=rows.filter(row=>row.some(cell=>cell.toLowerCase().includes(searchText.toLowerCase())));
 const primary=title==="Systeem Services"?"Geen live serviceacties":title==="DNS Beheer"?"Nieuwe zone":title==="Toon Alle Gebruikers"||title==="Mijn Gebruikers"?"Nieuwe gebruiker":"Nieuwe invoer";
 return '<div class="heading"><div><div class="eyebrow">Beheer / '+escapeHtml(role)+'</div><h1>'+escapeHtml(title)+'</h1><div class="subhead">Voorbeeldweergave. Wijzigingen worden niet naar een server verzonden.</div></div><div class="heading-actions"><button class="btn" data-go="Dashboard">← Dashboard</button><button class="btn primary" data-action="new">＋ '+escapeHtml(primary)+'</button></div></div><div class="panel"><div class="panel-head"><div class="panel-title"><span>▤</span> Overzicht</div><div class="panel-hint">'+filtered.length+' resultaten</div></div><div class="view-toolbar"><input id="tableSearch" class="search-field" placeholder="Filter deze lijst..." value="'+escapeHtml(searchText)+'" aria-label="Filter tabel"><button class="btn" id="resetTable">Wis filter</button></div><div style="overflow:auto"><table class="data-table"><thead><tr><th>Naam</th><th>Type</th><th>Status</th><th>Details</th><th></th></tr></thead><tbody>'+filtered.map(row=>'<tr><td><strong>'+escapeHtml(row[0])+'</strong></td><td>'+escapeHtml(row[1])+'</td><td><span class="status">'+escapeHtml(row[2])+'</span></td><td>'+escapeHtml(row[3])+'</td><td><button class="btn" data-detail="'+escapeHtml(row[0])+'">Bekijk</button></td></tr>').join("")+'</tbody></table>'+(filtered.length?"":'<div class="empty">Geen resultaten gevonden.</div>')+'</div></div>';
}
function categoryView(title){const found=visibleSections().find(s=>s.title===title);const items=found?found.items:allItems().filter(x=>x.label.toLowerCase().includes(title.toLowerCase())).map(x=>[x.label,x.icon]);return '<div class="heading"><div><div class="eyebrow">Beheer / '+escapeHtml(role)+'</div><h1>'+escapeHtml(title)+'</h1><div class="subhead">Selecteer een onderdeel om het overzicht te openen.</div></div><button class="btn" data-go="Dashboard">← Dashboard</button></div>'+panel(title,found?found.icon:"▦",items);}
function placeholderView(title){return '<div class="heading"><div><div class="eyebrow">Beheer / '+escapeHtml(role)+'</div><h1>'+escapeHtml(title)+'</h1><div class="subhead">Het scherm is voorbereid voor een toekomstige backend-koppeling.</div></div><button class="btn" data-go="Dashboard">← Dashboard</button></div><div class="panel" style="padding:35px"><div style="max-width:570px"><div class="tile-icon" style="margin-bottom:18px">⚙</div><h2 style="font-size:19px"> '+escapeHtml(title)+'</h2><p style="line-height:1.8;color:#8291a4;font-size:13px">Deze functie is beschikbaar in de navigatie. De beheeractie wordt pas geactiveerd zodra een geautoriseerde API is aangesloten. Er worden geen externe wijzigingen uitgevoerd.</p><button class="btn primary" data-action="info">Bekijk integratiestatus</button></div></div>';}
function searchView(){const matches=allItems().filter(x=>x.label.toLowerCase().includes(query.toLowerCase()));return '<div class="heading"><div><div class="eyebrow">Navigatie</div><h1>Zoek naar pagina\'s</h1><div class="subhead">Zoek door alle '+allItems().length+' beschikbare beheerschermen.</div></div><button class="btn" data-go="Dashboard">← Dashboard</button></div><div class="panel"><div class="view-toolbar" style="padding-top:22px"><input class="search-field" id="globalSearch" placeholder="Bijvoorbeeld DNS, gebruikers, backups..." value="'+escapeHtml(query)+'" autofocus></div>'+(matches.length?'<div style="padding:0 17px 22px">'+matches.map(x=>'<button class="nav-entry" data-go="'+escapeHtml(x.label)+'" style="color:#435976;border-bottom:1px solid #eef2f7;border-radius:0"><span class="tile-icon" style="width:34px;height:34px;font-size:17px">'+x.icon+'</span><span>'+escapeHtml(x.label)+'<small style="display:block;color:#98a4b5;margin-top:3px">'+escapeHtml(x.group)+'</small></span></button>').join("")+'</div>':'<div class="empty">Geen pagina gevonden.</div>')+'</div>';}
function render(){renderSidebar();$("breadcrumb").textContent=current;$("roleButton").textContent=role+" ▾";$("content").innerHTML=(current==="Dashboard"?dashboard():current==="Zoeken"?searchView():sampleRows[current]?listView(current):visibleSections().some(s=>s.title===current)?categoryView(current):placeholderView(current))+'<footer>HostingPanel · UI prototype · Geen live backendverbinding</footer>'; }
function toast(message){const el=$("toast");el.textContent=message;el.classList.remove("hidden");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add("hidden"),3600);}
function modal(title,message,form=false){$("modalRoot").innerHTML='<div class="modal-shade" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">'+escapeHtml(title)+'</h2><p>'+escapeHtml(message)+'</p>'+(form?'<label class="form-field">Naam<input id="newName" maxlength="60" placeholder="Naam invoeren" autocomplete="off"></label><label class="form-field">Type<select><option>Gebruiker</option><option>Reseller</option></select></label>':'')+'<div class="modal-actions"><button class="btn" data-action="close">Sluiten</button>'+(form?'<button class="btn primary" data-action="save">Bewaar als demo</button>':'')+'</div></div></div>';}
document.addEventListener("click",e=>{
 const toggle=e.target.closest("[data-nav-toggle]");if(toggle){const name=toggle.dataset.navToggle;expandedNavGroups.has(name)?expandedNavGroups.delete(name):expandedNavGroups.add(name);renderSidebar();return;}
 const goBtn=e.target.closest("[data-go]");if(goBtn){go(goBtn.dataset.go);return;}
 const action=e.target.closest("[data-action]");if(action){const a=action.dataset.action;if(a==="close")$("modalRoot").innerHTML="";if(a==="new")modal("Nieuwe invoer","Dit is een interactief prototype. Invoer wordt niet op een server aangemaakt.",true);if(a==="info")modal("Integratiestatus","De UI gebruikt uitsluitend lokale voorbeelddata. Voor productie zijn API, authenticatie, RBAC en auditlogging vereist.");if(a==="save"){const v=$("newName")?.value.trim();if(!v){toast("Vul eerst een naam in.");return;}$("modalRoot").innerHTML="";toast("Demo-invoer '"+v+"' is niet opgeslagen op een server.");}return;}
 const d=e.target.closest("[data-detail]");if(d){modal(d.dataset.detail,"Dit is een voorbeeldrecord. Detailinformatie wordt na een backend-koppeling beschikbaar.");return;}
 if(e.target.closest("#widgetToggle")){widgets=!widgets;render();return;}
 if(e.target.closest("#resetTable")){searchText="";render();return;}
 if(e.target.closest("#navSearch")||e.target.closest("#topSearch")){go("Zoeken");$("globalSearch")?.focus();return;}
 if(e.target.closest("#mobileMenu")){$("sidebar").classList.toggle("open");$("shade").classList.toggle("show");return;}
 if(e.target.closest("#shade")){closeSidebar();return;}
 if(e.target.closest("#messages")){modal("Meldingen","Er is geen verbinding met een berichtenserver. Meldingen op het dashboard zijn uitsluitend demonstratief.");return;}
 if(e.target.closest("#roleButton")){role=role==="Admin"?"Gebruiker":"Admin";go("Dashboard");toast("Interfaceweergave: "+role+". Dit is geen beveiligings- of autorisatiewijziging.");return;}
 if(e.target.classList.contains("modal-shade"))$("modalRoot").innerHTML="";
});
document.addEventListener("input",e=>{if(e.target.id==="globalSearch"){query=e.target.value;const pos=e.target.selectionStart;render();const input=$("globalSearch");input.focus();input.setSelectionRange(pos,pos);}if(e.target.id==="tableSearch"){searchText=e.target.value;const pos=e.target.selectionStart;render();const input=$("tableSearch");input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();go("Zoeken");$("globalSearch")?.focus();}if(e.key==="Escape"){$("modalRoot").innerHTML="";closeSidebar();}});
$("language").addEventListener("change",e=>{toast(e.target.value==="en"?"English translations are not yet implemented.":"Nederlands geselecteerd.");if(e.target.value==="en")e.target.value="nl";});
render();
</script>
<script src="pages.js"></script>
