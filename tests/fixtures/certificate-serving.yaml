apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bootstrap
  namespace: certificate-serving-test
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root
  namespace: certificate-serving-test
spec:
  isCA: true
  commonName: HostingPanel isolated CI root
  secretName: test-root-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: test-ca
  namespace: certificate-serving-test
spec:
  ca:
    secretName: test-root-ca
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: fixture
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: fixture
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: fixture
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: certificate-serving-test
spec:
  gatewayClassName: fixture
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fixture-content
  namespace: certificate-serving-test
data:
  index.html: hostingpanel-tls-fixture
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-baseline
  namespace: certificate-serving-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: certificate-fixture
  template:
    metadata:
      labels:
        app: certificate-fixture
    spec:
      containers:
        - name: http
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/local/apache2/htdocs
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: fixture-content
---
apiVersion: v1
kind: Service
metadata:
  name: apache-baseline
  namespace: certificate-serving-test
spec:
  selector:
    app: certificate-fixture
  ports:
    - port: 80
      targetPort: 80
