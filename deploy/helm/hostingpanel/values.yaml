backend: DirectAdmin
directAdmin:
  baseUrl: https://directadmin.example.invalid:2222/
web:
  image:
    repository: hostingpanel-web
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
imagePullSecrets: []
sqlite:
  size: 1Gi
  storageClassName: ""
  existingClaim: ""
bootstrap:
  existingSecret: ""
ingress:
  enabled: false
  className: ""
  host: panel.example.invalid
  tlsSecret: ""

kubernetesHosting:
  enabled: false
  # Match the cluster minor version (within supported kubectl skew).
  kubectlVersion: v1.35.5
  toolsImage: curlimages/curl:8.17.0
  nfsServer: ""
  # Existing DirectAdmin /home export, containing username/domains/domain/public_html
  nfsPath: ""
  # Optional existing PVC for the provisioning filesystem. Its root must
  # correspond to nfsPath and permit the authorized provisioning identity.
  provisioningClaim: ""
  gatewayName: ""
  gatewayNamespace: envoy-gateway-system
  httpListener: http
  httpsListener: https
  apacheImage: httpd:2.4
  vhostSyncImage: python:3.13-alpine
  phpImage: php:8.6.0-fpm
  phpReplicas: 1
  allowSharedPhpRuntime: false
  panelRoute:
    enabled: false
    hostname: ""
    listener: https

# Authoritative DNS is deployed for the Kubernetes backend by default.
powerDns:
  enabled: true
  image: powerdns/pdns-auth-49:latest
  storageClassName: ""
  size: 1Gi
  existingClaim: ""
  existingSecret: ""
  serviceType: LoadBalancer
  autoCreateZones: true
  # Public web ingress address, not the PowerDNS service address.
  webIp: ""
  ns1: ""
  ns2: ""

# External cert-manager installation required when enabled. No dependency or CRDs are installed.
certManager:
  enabled: true
