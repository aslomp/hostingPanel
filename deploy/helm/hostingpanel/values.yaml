backend: DirectAdmin
directAdmin:
  baseUrl: https://directadmin.example.invalid:2222/
web:
  image:
    repository: hostingpanel-web
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
imagePullSecrets: []
sqlite:
  size: 1Gi
  storageClassName: ""
  existingClaim: ""
bootstrap:
  existingSecret: ""
ingress:
  enabled: false
  className: ""
  host: panel.example.invalid
  tlsSecret: ""

kubernetesHosting:
  enabled: false
  nfsServer: ""
  # Existing DirectAdmin /home export, containing username/domains/domain/public_html
  nfsPath: ""
  # Optional existing PVC for the provisioning filesystem. Its root must
  # correspond to nfsPath and permit the authorized provisioning identity.
  provisioningClaim: ""
  # Required dedicated direct NFS export on nfsServer; must not overlap nfsPath.
  apacheConfigPath: ""
  zfsQuota:
    enabled: false
    host: ""
    existingSecret: "" # private-key and known-hosts
  gatewayName: ""
  gatewayNamespace: envoy-gateway-system
  httpListener: http
  httpsListener: https
  apacheImage: httpd:2.4
  apacheReplicas: 1
  # Customer access/error log retention; monthly accounting is retained separately.
  logRetentionDays: 30
  accountingSpool:
    enabled: false
    # Separate NFS export, writable by Apache UID/GID 1001.
    path: ""
    # Apache image containing Python 3 (standard library only).
    image: ""
    # HTTPS URL of the panel, including trusted certificate chain.
    endpoint: ""
    existingSecret: "" # key: token
  phpImage: php:8.6.0-fpm
  phpReplicas: 1
  allowSharedPhpRuntime: false
  panelRoute:
    enabled: false
    hostname: ""
    listener: https

# Authoritative DNS is deployed for the Kubernetes backend by default.
powerDns:
  enabled: true
  image: powerdns/pdns-auth-49:latest
  # Supplemental group granting the non-root init and server containers access to the PVC.
  fsGroup: 953
  storageClassName: ""
  size: 1Gi
  existingClaim: ""
  existingSecret: ""
  serviceType: LoadBalancer
  # Optional node-owned addresses for ClusterIP DNS exposure (no ServiceLB hostPort).
  externalIPs: []
  autoCreateZones: true
  # Public web ingress address, not the PowerDNS service address.
  webIp: ""
  ns1: ""
  ns2: ""

# External cert-manager installation required when enabled. No dependency or CRDs are installed.
certManager:
  enabled: true

  # Dedicated controller-owned ListenerSet, created when a domain certificate is ready.
  listenerSetName: hosting-sites

# Optional shared MariaDB server for hosted applications.
mariadb:
  enabled: false
  image: mariadb:11.4
  storageClassName: ""
  size: 10Gi
  existingClaim: ""
  # Existing Secret with key root-password; mounted only in MariaDB.
  existingSecret: ""
  # Separate existing Secret with key password (64 hexadecimal characters).
  provisioningSecret: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

# Optional Stalwart v1 mail infrastructure (Kubernetes backend only).
stalwart:
  enabled: false
  api:
    enabled: false
    autoProvisionDns: true
    # Optional import of panel-owned mail records; native DKIM does not require this.
    periodicDnsSync: false
    dnsSyncMinutes: 60
    autoRegisterDnsProvider: true
    # ID of an existing Stalwart DnsServer configured for this PowerDNS service.
    dkimDnsServerId: ""
    # HTTPS origin matching the Stalwart TLS certificate, reachable from the panel.
    baseUrl: ""
    # Existing Secret with key api-key; dedicated restricted management identity.
    existingSecret: ""
  image: stalwartlabs/stalwart:v1
  imagePullPolicy: IfNotPresent
  storageClassName: ""
  configSize: 1Gi
  dataSize: 20Gi
  # Existing independent ReadWriteOnce filesystem claims (optional).
  existingConfigClaim: ""
  existingDataClaim: ""
  # Optional Secret key recovery-admin containing username:password.
  # Remove after initial setup.
  existingSecret: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # HTTPS also serves JMAP and the admin UI; enable only with suitable access controls.
    httpsEnabled: false
    submissionEnabled: false
    pop3Enabled: false

# Shared OpenSSH service. No management server or privileged mount operations.
sftp:
  enabled: true
  enableWrites: true
  jailExport: /srv/hosting/sftp-jails # dedicated root-owned NFS jail export, prepared by installer
  image: hostingpanel-openssh:installer-local # override with registry image on multi-node clusters
  existingSecret: hostingpanel-ssh-hostkeys # ssh_host_ed25519_key; created by installer
  service:
    type: LoadBalancer
    port: 2223 # TCP 22 is host SSH; TCP 2222 is DirectAdmin
    externalTrafficPolicy: Local
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
# Legacy migration guard only; do not enable.
sftpgo:
  enabled: false
