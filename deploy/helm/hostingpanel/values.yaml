backend: DirectAdmin
directAdmin:
  baseUrl: https://directadmin.example.invalid:2222/
web:
  image:
    repository: hostingpanel-web
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
imagePullSecrets: []
sqlite:
  size: 1Gi
  storageClassName: ""
  existingClaim: ""
bootstrap:
  existingSecret: ""
ingress:
  enabled: false
  className: ""
  host: panel.example.invalid
  tlsSecret: ""

kubernetesHosting:
  enabled: false
  nfsServer: ""
  # Existing DirectAdmin /home export, containing username/domains/domain/public_html
  nfsPath: ""
  # Optional existing PVC for the provisioning filesystem. Its root must
  # correspond to nfsPath and permit the authorized provisioning identity.
  provisioningClaim: ""
  # Required existing RWX NFS PVC for enabled hosting. Must not overlap customer storage.
  apacheConfigClaim: ""
  gatewayName: ""
  gatewayNamespace: envoy-gateway-system
  httpListener: http
  httpsListener: https
  apacheImage: httpd:2.4
  apacheReplicas: 1
  phpImage: php:8.6.0-fpm
  phpReplicas: 1
  allowSharedPhpRuntime: false
  panelRoute:
    enabled: false
    hostname: ""
    listener: https

# Authoritative DNS is deployed for the Kubernetes backend by default.
powerDns:
  enabled: true
  image: powerdns/pdns-auth-49:latest
  storageClassName: ""
  size: 1Gi
  existingClaim: ""
  existingSecret: ""
  serviceType: LoadBalancer
  autoCreateZones: true
  # Public web ingress address, not the PowerDNS service address.
  webIp: ""
  ns1: ""
  ns2: ""

# External cert-manager installation required when enabled. No dependency or CRDs are installed.
certManager:
  enabled: true

  # Existing ListenerSet in the release namespace; reserve hp-tls-* listeners for HostingPanel.
  listenerSetName: ""

# Optional shared MariaDB server for hosted applications.
mariadb:
  enabled: false
  image: mariadb:11.4
  storageClassName: ""
  size: 10Gi
  existingClaim: ""
  # Existing Secret with key root-password; mounted only in MariaDB.
  existingSecret: ""
  # Separate existing Secret with key password (64 hexadecimal characters).
  provisioningSecret: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
