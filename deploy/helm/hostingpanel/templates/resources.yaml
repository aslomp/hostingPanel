{{- if not (has .Values.backend (list "DirectAdmin" "Kubernetes")) }}
{{- fail "backend must be DirectAdmin or Kubernetes" }}
{{- end }}
{{- $name := include "hostingpanel.name" . }}
{{- $hosting := and (eq .Values.backend "Kubernetes") .Values.kubernetesHosting.enabled }}
{{- if not .Values.sqlite.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.sqlite.storageClassName }}
  storageClassName: {{ .Values.sqlite.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sqlite.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: {{ $hosting }}
      {{- if $hosting }}
      serviceAccountName: {{ $name }}-controller
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: HostingPanel__Backend
              value: {{ .Values.backend | quote }}
            {{- if eq .Values.backend "DirectAdmin" }}
            - name: DirectAdmin__BaseUrl
              value: {{ .Values.directAdmin.baseUrl | quote }}
            {{- end }}
            {{- if $hosting }}
            - name: CertManager__ListenerSetName
              value: {{ .Values.certManager.listenerSetName | quote }}
            - name: BackendSettings__TlsListenerSetName
              value: {{ .Values.certManager.listenerSetName | quote }}
            - name: CertManager__Enabled
              value: {{ .Values.certManager.enabled | quote }}
            - name: KubernetesHosting__Enabled
              value: "true"
            - name: KubernetesHosting__Namespace
              value: {{ .Release.Namespace | quote }}
            - name: KubernetesHosting__NfsServer
              value: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            - name: KubernetesHosting__NfsPath
              value: {{ required "kubernetesHosting.nfsPath is required" .Values.kubernetesHosting.nfsPath | quote }}
            - name: KubernetesHosting__NfsProvisioningPath
              value: /storage/sites
            - name: KubernetesHosting__ApacheConfigPath
              value: /storage/apache-config
            - name: KubernetesHosting__GatewayName
              value: {{ required "kubernetesHosting.gatewayName is required" .Values.kubernetesHosting.gatewayName | quote }}
            - name: KubernetesHosting__GatewayNamespace
              value: {{ .Values.kubernetesHosting.gatewayNamespace | quote }}
            - name: KubernetesHosting__HttpListener
              value: {{ .Values.kubernetesHosting.httpListener | quote }}
            - name: KubernetesHosting__HttpsListener
              value: {{ .Values.kubernetesHosting.httpsListener | quote }}
            - name: BackendSettings__IngressProvider
              value: EnvoyProxy
            - name: KubernetesHosting__ApacheImage
              value: {{ .Values.kubernetesHosting.apacheImage | quote }}
            - name: KubernetesHosting__Php8Image
              value: {{ .Values.kubernetesHosting.phpImage | quote }}
            - name: KubernetesHosting__EnablePhp7
              value: "false"
            - name: KubernetesHosting__DefaultPhpVersion
              value: "8"
            - name: KubernetesHosting__Php8Replicas
              value: {{ .Values.kubernetesHosting.phpReplicas | quote }}
            - name: KubernetesHosting__AllowSharedPhpRuntime
              value: {{ .Values.kubernetesHosting.allowSharedPhpRuntime | quote }}
            {{- end }}
            {{- if and (eq .Values.backend "Kubernetes") .Values.powerDns.enabled }}
            - name: PowerDns__Enabled
              value: "true"
            - name: PowerDns__AutoCreateZones
              value: {{ .Values.powerDns.autoCreateZones | quote }}
            - name: PowerDns__WebIp
              value: {{ .Values.powerDns.webIp | quote }}
            - name: PowerDns__Ns1
              value: {{ .Values.powerDns.ns1 | quote }}
            - name: PowerDns__Ns2
              value: {{ .Values.powerDns.ns2 | quote }}
            - name: PowerDns__BaseUrl
              value: {{ printf "http://%s-powerdns-api:8081" $name | quote }}
            - name: PowerDns__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-powerdns" $name) .Values.powerDns.existingSecret | quote }}
                  key: api-key
            {{- end }}
            {{- if and (eq .Values.backend "Kubernetes") .Values.mariadb.enabled }}
            - name: MariaDb__Server
              value: {{ printf "%s-mariadb" .Release.Name | quote }}
            - name: MariaDb__ProvisioningPassword
              valueFrom:
                secretKeyRef:
                  name: {{ required "mariadb.provisioningSecret is required when MariaDB is enabled" .Values.mariadb.provisioningSecret | quote }}
                  key: password
            {{- end }}
            {{- if and (eq .Values.backend "Kubernetes") .Values.stalwart.api.enabled }}
            - name: Stalwart__Enabled
              value: "true"
            - name: Stalwart__AutoProvisionDns
              value: {{ .Values.stalwart.api.autoProvisionDns | quote }}
            - name: Stalwart__BaseUrl
              value: {{ required "stalwart.api.baseUrl is required" .Values.stalwart.api.baseUrl | quote }}
            - name: Stalwart__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ required "stalwart.api.existingSecret is required" .Values.stalwart.api.existingSecret | quote }}
                  key: api-key
            {{- end }}
            - name: ConnectionStrings__HostingPanel
              value: "Data Source=/data/hostingpanel.db;Foreign Keys=True;Default Timeout=5"
            {{- if and (eq .Values.backend "Kubernetes") .Values.bootstrap.existingSecret }}
            - name: HostingPanel__Bootstrap__Username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret | quote }}
                  key: username
            - name: HostingPanel__Bootstrap__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret | quote }}
                  key: password
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if $hosting }}
            - {name: sites, mountPath: /storage/sites}
            - {name: apache-config, mountPath: /storage/apache-config}
            {{- end }}
      volumes:
        {{- if $hosting }}
        - name: sites
          {{- if .Values.kubernetesHosting.provisioningClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.kubernetesHosting.provisioningClaim | quote }}
          {{- else }}
          nfs:
            server: {{ .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ .Values.kubernetesHosting.nfsPath | quote }}
            readOnly: false
          {{- end }}
        {{- end }}
        {{- if $hosting }}
        - name: apache-config
          nfs:
            server: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ include "hostingpanel.apacheConfigExport" . | quote }}
            readOnly: false
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" $name) .Values.sqlite.existingClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: web
  ports: [{name: http, port: 8080, targetPort: http}]
---
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-web
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tlsSecret is required when ingress is enabled" .Values.ingress.tlsSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-web
                port: {number: 8080}
{{- end }}
