{{- if not (has .Values.backend (list "DirectAdmin" "Kubernetes")) }}
{{- fail "backend must be DirectAdmin or Kubernetes" }}
{{- end }}
{{- $name := include "hostingpanel.name" . }}
{{- $hosting := and (eq .Values.backend "Kubernetes") .Values.kubernetesHosting.enabled }}
{{- if not .Values.sqlite.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.sqlite.storageClassName }}
  storageClassName: {{ .Values.sqlite.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sqlite.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: {{ $hosting }}
      {{- if $hosting }}
      serviceAccountName: {{ $name }}-controller
      initContainers:
        - name: kubectl
          image: {{ .Values.kubernetesHosting.toolsImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) exit 1 ;; esac
              url="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/$arch/kubectl"
              curl --fail --silent --show-error --location "$url" -o /tools/kubectl
              curl --fail --silent --show-error --location "$url.sha256" -o /tools/kubectl.sha256
              cd /tools
              echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
              chmod 0755 kubectl
          env:
            - name: KUBECTL_VERSION
              value: {{ .Values.kubernetesHosting.kubectlVersion | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tools, mountPath: /tools}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: HostingPanel__Backend
              value: {{ .Values.backend | quote }}
            {{- if eq .Values.backend "DirectAdmin" }}
            - name: DirectAdmin__BaseUrl
              value: {{ .Values.directAdmin.baseUrl | quote }}
            {{- end }}
            {{- if $hosting }}
            - name: KubernetesHosting__Enabled
              value: "true"
            - name: KubernetesHosting__Namespace
              value: {{ .Release.Namespace | quote }}
            - name: KubernetesHosting__KubectlPath
              value: /tools/kubectl
            - name: KubernetesHosting__NfsServer
              value: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            - name: KubernetesHosting__NfsPath
              value: {{ required "kubernetesHosting.nfsPath is required" .Values.kubernetesHosting.nfsPath | quote }}
            - name: KubernetesHosting__NfsProvisioningPath
              value: /storage/sites
            - name: KubernetesHosting__GatewayName
              value: {{ required "kubernetesHosting.gatewayName is required" .Values.kubernetesHosting.gatewayName | quote }}
            - name: KubernetesHosting__GatewayNamespace
              value: {{ .Values.kubernetesHosting.gatewayNamespace | quote }}
            - name: KubernetesHosting__HttpListener
              value: {{ .Values.kubernetesHosting.httpListener | quote }}
            - name: KubernetesHosting__HttpsListener
              value: {{ .Values.kubernetesHosting.httpsListener | quote }}
            - name: BackendSettings__IngressProvider
              value: EnvoyProxy
            - name: KubernetesHosting__ApacheImage
              value: {{ .Values.kubernetesHosting.apacheImage | quote }}
            - name: KubernetesHosting__Php8Image
              value: {{ .Values.kubernetesHosting.phpImage | quote }}
            - name: KubernetesHosting__EnablePhp7
              value: "false"
            - name: KubernetesHosting__DefaultPhpVersion
              value: "8"
            - name: KubernetesHosting__Php8Replicas
              value: {{ .Values.kubernetesHosting.phpReplicas | quote }}
            - name: KubernetesHosting__AllowSharedPhpRuntime
              value: {{ .Values.kubernetesHosting.allowSharedPhpRuntime | quote }}
            {{- end }}
            - name: ConnectionStrings__HostingPanel
              value: "Data Source=/data/hostingpanel.db;Foreign Keys=True;Default Timeout=5"
            {{- if and (eq .Values.backend "Kubernetes") .Values.bootstrap.existingSecret }}
            - name: HostingPanel__Bootstrap__Username
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret | quote }}
                  key: username
            - name: HostingPanel__Bootstrap__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret | quote }}
                  key: password
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if $hosting }}
            - {name: tools, mountPath: /tools, readOnly: true}
            - {name: sites, mountPath: /storage/sites}
            {{- end }}
      volumes:
        {{- if $hosting }}
        - name: tools
          emptyDir: {}
        - name: sites
          {{- if .Values.kubernetesHosting.provisioningClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.kubernetesHosting.provisioningClaim | quote }}
          {{- else }}
          nfs:
            server: {{ .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ .Values.kubernetesHosting.nfsPath | quote }}
            readOnly: true
          {{- end }}
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" $name) .Values.sqlite.existingClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: web
  ports: [{name: http, port: 8080, targetPort: http}]
---
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-web
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tlsSecret is required when ingress is enabled" .Values.ingress.tlsSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-web
                port: {number: 8080}
{{- end }}
