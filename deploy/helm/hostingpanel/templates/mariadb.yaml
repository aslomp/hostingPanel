{{- if and (eq .Values.backend "Kubernetes") .Values.mariadb.enabled }}
{{- $name := printf "%s-mariadb" .Release.Name }}
{{- $secret := required "mariadb.existingSecret is required when MariaDB is enabled" .Values.mariadb.existingSecret }}
{{- $provisioning := required "mariadb.provisioningSecret is required when MariaDB is enabled" .Values.mariadb.provisioningSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
data:
  10-hostingpanel.sh: |
    # Sourced by the official MariaDB entrypoint during first initialization only.
    # Restrict the bootstrap password to 64 hexadecimal characters before SQL construction.
    if [[ ! "${HOSTINGPANEL_PROVISIONING_PASSWORD}" =~ ^[0-9a-fA-F]{64}$ ]]; then
      echo "MariaDB provisioning password must contain exactly 64 hexadecimal characters" >&2
      return 1
    fi
    docker_process_sql <<SQL
    CREATE USER 'hostingpanel_provisioner'@'%' IDENTIFIED BY '${HOSTINGPANEL_PROVISIONING_PASSWORD}';
    GRANT CREATE USER, CREATE, DROP, ALTER, SELECT, INSERT, UPDATE, DELETE, INDEX, REFERENCES, CREATE TEMPORARY TABLES, LOCK TABLES, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, EXECUTE, EVENT, TRIGGER ON *.* TO 'hostingpanel_provisioner'@'%' WITH GRANT OPTION;
    SQL
---
{{- if not .Values.mariadb.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  {{- with .Values.mariadb.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mariadb.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: root-password
            - name: HOSTINGPANEL_PROVISIONING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $provisioning | quote }}
                  key: password
            - name: MARIADB_ROOT_HOST
              value: localhost
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/10-hostingpanel.sh
              subPath: 10-hostingpanel.sh
              readOnly: true
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: bootstrap
          configMap:
            name: {{ $name }}-init
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $name .Values.mariadb.existingClaim | quote }}
{{- end }}
