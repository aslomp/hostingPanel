{{- if and (eq .Values.backend "Kubernetes") .Values.kubernetesHosting.enabled }}
{{- $name := include "hostingpanel.name" . }}
{{- if or (lt (int .Values.kubernetesHosting.apacheReplicas) 1) (gt (int .Values.kubernetesHosting.apacheReplicas) 32) }}
{{- fail "kubernetesHosting.apacheReplicas must be between 1 and 32" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{- range $i := until (int .Values.kubernetesHosting.apacheReplicas) }}{{ if $i }}, {{ end }}{{ printf "apache-baseline-%d" $i | quote }}{{- end }}]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  {{- if .Values.certManager.enabled }}
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list"]
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["orders", "challenges"]
    verbs: ["get", "list"]
  {{- if .Values.certManager.listenerSetName }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["listenersets"]
    resourceNames: [{{ .Values.certManager.listenerSetName | quote }}]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["listenersets"]
    verbs: ["create"]
  {{- end }}
  {{- end }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-baseline
data:
  httpd.conf: |
    ServerRoot "/usr/local/apache2"
    Listen 8080
    Listen 8081
    ServerName localhost
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule unixd_module modules/mod_unixd.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule log_config_module modules/mod_log_config.so
    LoadModule dir_module modules/mod_dir.so
    LoadModule mime_module modules/mod_mime.so
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
    PidFile /tmp/httpd.pid
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
    TypesConfig conf/mime.types
    User daemon
    Group daemon
    <Directory />
        AllowOverride None
        Require all denied
    </Directory>
    ServerTokens Prod
    ServerSignature Off
    TraceEnable Off
    ProxyRequests Off
    <VirtualHost *:8080>
        ServerName localhost
        <Location "/">
            Require all denied
        </Location>
    </VirtualHost>
    # Dedicated probe listener; not exposed by the shared HTTP Service.
    <VirtualHost *:8081>
        ServerName localhost
        DocumentRoot "/usr/local/apache2/htdocs"
        <Directory "/usr/local/apache2/htdocs">
            Options None
            AllowOverride None
            Require all granted
            DirectoryIndex index.html
        </Directory>
    </VirtualHost>
    <IfDefine !HOSTINGPANEL_CANDIDATE>
        IncludeOptional /storage/apache-config/active.conf
    </IfDefine>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apache-baseline
spec:
  serviceName: apache-baseline-headless
  podManagementPolicy: Parallel
  replicas: {{ .Values.kubernetesHosting.apacheReplicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: apache-baseline}
  template:
    metadata:
      labels: {app.kubernetes.io/name: apache-baseline}
      annotations:
        hostingpanel/apache-config: "shared-nfs-v1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: apache
          image: {{ .Values.kubernetesHosting.apacheImage | quote }}
          command: ["httpd", "-DFOREGROUND", "-f", "/etc/hostingpanel/httpd.conf"]
          ports: [{name: http, containerPort: 8080}, {name: health, containerPort: 8081}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /etc/hostingpanel, readOnly: true}
            - {name: sites, mountPath: /home, readOnly: true}
            - {name: apache-config, mountPath: /storage/apache-config, readOnly: true}
      volumes:
        - name: apache-config
          nfs:
            server: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ include "hostingpanel.apacheConfigExport" . | quote }}
            readOnly: true
        - name: config
          configMap:
            name: apache-baseline
        - name: sites
          nfs:
            server: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ required "kubernetesHosting.nfsPath is required" .Values.kubernetesHosting.nfsPath | quote }}
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: apache-baseline
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: apache-baseline}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: apache-baseline-headless
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: apache-baseline}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if .Values.kubernetesHosting.panelRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-web
spec:
  parentRefs:
    - name: {{ required "gatewayName is required" .Values.kubernetesHosting.gatewayName | quote }}
      namespace: {{ .Values.kubernetesHosting.gatewayNamespace | quote }}
      sectionName: {{ .Values.kubernetesHosting.panelRoute.listener | quote }}
  hostnames:
    - {{ required "panelRoute.hostname is required" .Values.kubernetesHosting.panelRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ $name }}-web
          port: 8080
{{- end }}
{{- end }}

{{- if and (eq .Values.backend "Kubernetes") .Values.kubernetesHosting.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hostingpanel.name" . }}-gateway-reader
  namespace: {{ .Values.kubernetesHosting.gatewayNamespace | quote }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: [{{ .Values.kubernetesHosting.gatewayName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hostingpanel.name" . }}-gateway-reader
  namespace: {{ .Values.kubernetesHosting.gatewayNamespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hostingpanel.name" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hostingpanel.name" . }}-gateway-reader
{{- end }}
