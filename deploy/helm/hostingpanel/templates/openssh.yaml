{{- if .Values.sftpgo.enabled }}
{{- fail "SFTPGo has been retired: disable sftpgo.enabled, supply sftp.image and sftp.existingSecret, then enable sftp.enabled" }}
{{- end }}
{{- if and (eq .Values.backend "Kubernetes") .Values.kubernetesHosting.enabled .Values.sftp.enabled }}
{{- $s := .Values.sftp }}
{{- $name := printf "%s-sftp" .Release.Name | trunc 54 | trimSuffix "-" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-bootstrap
data:
  accounts.json: "[]"
immutable: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ $s.service.type }}
  selector:
    hostingpanel/sftp-workload: {{ $name }}
  ports:
    - {name: sftp, port: {{ $s.service.port }}, targetPort: sftp}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    hostingpanel/component: openssh
    hostingpanel/sftp-workload: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      hostingpanel/sftp-workload: {{ $name }}
  template:
    metadata:
      labels:
        hostingpanel/sftp-workload: {{ $name }}
      annotations:
        hostingpanel/sftp-revision: bootstrap
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openssh
          image: {{ required "sftp.image is required (Dockerfile.openssh)" $s.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [SETUID, SETGID, SYS_CHROOT, KILL]
          env:
            - name: HP_SFTP_REVISION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['hostingpanel/sftp-revision']
          ports:
            - {name: sftp, containerPort: 2022}
          readinessProbe:
            tcpSocket: {port: sftp}
          resources: {{ toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/hostingpanel, readOnly: true}
            - {name: hostkeys, mountPath: /run/hostingpanel-hostkeys, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-bootstrap
        - name: hostkeys
          secret:
            secretName: {{ required "sftp.existingSecret is required" $s.existingSecret | quote }}
            defaultMode: 0400
        - name: sites
          nfs:
            server: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ required "kubernetesHosting.nfsPath is required" .Values.kubernetesHosting.nfsPath | quote }}
            readOnly: {{ not $s.enableWrites }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      hostingpanel/sftp-workload: {{ $name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 2022}
  egress: []
{{- end }}
