{{- if and (eq .Values.backend "Kubernetes") .Values.stalwart.enabled }}
{{- $s := .Values.stalwart }}
{{- $name := printf "%s-stalwart" .Release.Name | trunc 54 | trimSuffix "-" }}
{{- if and $s.existingConfigClaim (eq $s.existingConfigClaim $s.existingDataClaim) }}
{{- fail "Stalwart requires separate config and data claims" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: stalwart
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: stalwart
  ports:
    - {name: bootstrap, port: 8080, targetPort: bootstrap}
    - {name: https, port: 443, targetPort: https}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- with $s.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $s.service.type }}
  {{- if or (eq $s.service.type "LoadBalancer") (eq $s.service.type "NodePort") }}
  externalTrafficPolicy: {{ $s.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: stalwart
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
    - {name: submissions, port: 465, targetPort: submissions}
    - {name: imaps, port: 993, targetPort: imaps}
    - {name: sieve, port: 4190, targetPort: sieve}
    {{- if $s.service.submissionEnabled }}
    - {name: submission, port: 587, targetPort: submission}
    {{- end }}
    {{- if $s.service.pop3Enabled }}
    - {name: pop3s, port: 995, targetPort: pop3s}
    {{- end }}
    {{- if $s.service.httpsEnabled }}
    - {name: https, port: 443, targetPort: https}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: stalwart
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: stalwart
          image: {{ $s.image | quote }}
          imagePullPolicy: {{ $s.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- if $s.existingSecret }}
          env:
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ $s.existingSecret | quote }}
                  key: recovery-admin
          {{- end }}
          ports:
            - {name: smtp, containerPort: 25}
            - {name: submissions, containerPort: 465}
            - {name: submission, containerPort: 587}
            - {name: imaps, containerPort: 993}
            - {name: pop3s, containerPort: 995}
            - {name: sieve, containerPort: 4190}
            - {name: https, containerPort: 443}
            - {name: bootstrap, containerPort: 8080}
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/stalwart}
            - {name: data, mountPath: /var/lib/stalwart}
      {{- if or $s.existingConfigClaim $s.existingDataClaim }}
      volumes:
        {{- if $s.existingConfigClaim }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ $s.existingConfigClaim | quote }}
        {{- end }}
        {{- if $s.existingDataClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $s.existingDataClaim | quote }}
        {{- end }}
      {{- end }}
  {{- if or (not $s.existingConfigClaim) (not $s.existingDataClaim) }}
  volumeClaimTemplates:
    {{- range $volume := list (dict "name" "config" "claim" $s.existingConfigClaim "size" $s.configSize) (dict "name" "data" "claim" $s.existingDataClaim "size" $s.dataSize) }}
    {{- if not $volume.claim }}
    - metadata:
        name: {{ $volume.name }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $s.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $volume.size | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
