{{- if and (eq .Values.backend "Kubernetes") .Values.kubernetesHosting.enabled .Values.sftpgo.enabled }}
{{- $s := .Values.sftpgo }}
{{- $name := printf "%s-sftpgo" .Release.Name | trunc 54 | trimSuffix "-" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sftpgo
  ports:
    - {name: sftp, port: 2022, targetPort: sftp}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ $s.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sftpgo
  ports:
    - {name: sftp, port: {{ $s.service.port }}, targetPort: sftp}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sftpgo
  ports:
    - {name: management, port: 8080, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sftpgo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sftpgo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sftpgo
          image: {{ $s.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- if $s.enableWrites }}
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            {{- else }}
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            {{- end }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              {{- if $s.enableWrites }}
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
              {{- end }}
          env:
            - {name: SFTPGO_SFTPD__BINDINGS__0__PORT, value: "2022"}
            - {name: SFTPGO_SFTPD__PASSWORD_AUTHENTICATION, value: "false"}
            - {name: SFTPGO_SFTPD__KEYBOARD_INTERACTIVE_AUTHENTICATION, value: "false"}
            - {name: SFTPGO_SFTPD__ENABLED_SSH_COMMANDS, value: ""}
            - {name: SFTPGO_COMMON__SYMLINK_MODE, value: "0"}
            - {name: SFTPGO_FTPD__BINDINGS__0__PORT, value: "0"}
            - {name: SFTPGO_WEBDAVD__BINDINGS__0__PORT, value: "0"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__PORT, value: "8080"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT, value: "false"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN, value: "false"}
            - {name: SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN, value: "true"}
            - name: SFTPGO_DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "sftpgo.existingSecret is required" $s.existingSecret | quote }}
                  key: username
            - name: SFTPGO_DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $s.existingSecret | quote }}
                  key: password
          ports:
            - {name: sftp, containerPort: 2022}
            - {name: management, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: sftp}
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/sftpgo}
            - {name: sites, mountPath: /home, readOnly: {{ not $s.enableWrites }}}
      securityContext:
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: sites
          nfs:
            server: {{ required "kubernetesHosting.nfsServer is required" .Values.kubernetesHosting.nfsServer | quote }}
            path: {{ required "kubernetesHosting.nfsPath is required" .Values.kubernetesHosting.nfsPath | quote }}
            readOnly: {{ not $s.enableWrites }}
        {{- if $s.existingClaim }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ $s.existingClaim | quote }}
        {{- end }}
  {{- if not $s.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $s.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $s.size | quote }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sftpgo
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 2022}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: web
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
{{- end }}
