# helm upgrade --install admin deploy/helm/hostingpanel -n hosting --create-namespace -f deploy/helm/values-hosting.example.yaml
backend: Kubernetes
web:
  image:
    repository: harbor.eagleconnect.nl/hosting/admin
    tag: latest
    pullPolicy: Always
# Set to an existing image pull secret if Harbor requires authentication.
imagePullSecrets: []
bootstrap:
  existingSecret: hostingpanel-bootstrap
sqlite:
  size: 1Gi
  storageClassName: ""
ingress:
  enabled: false
kubernetesHosting:
  enabled: true
  kubectlVersion: v1.35.5
  nfsServer: ""
  # Example: /home (if the export root directly contains DirectAdmin usernames)
  nfsPath: ""
  provisioningClaim: ""
  gatewayName: ""
  gatewayNamespace: envoy-gateway-system
  httpListener: http
  httpsListener: https
  apacheImage: httpd:2.4
  vhostSyncImage: python:3.13-alpine
  phpImage: php:8.6.0-fpm
  phpReplicas: 1
  # Explicit opt-in: only mutually trusted PHP applications until tenant
  # isolation is validated on the actual cluster.
  allowSharedPhpRuntime: true
  panelRoute:
    enabled: false
    hostname: ""
    listener: https

# Optional database server; set enabled and provide the Secret before deploying.
mariadb:
  enabled: false
  storageClassName: iscsi
  size: 20Gi
  existingSecret: hostingpanel-mariadb
